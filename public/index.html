<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        
        <!-- Primary Meta Tags -->
        <title>Leamse | Soluções em Tecnologia</title>
        <meta name="title" content="Leamse | Soluções em Tecnologia" />
        <meta name="description" content="Leamse - Inovação e excelência em tecnologia. Transforme o seu negócio com nossas soluções digitais." />
        <meta name="robots" content="index, follow" />

        <!-- Open Graph / Facebook / WhatsApp -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://leamse.com/" />
        <meta property="og:title" content="Leamse | Soluções em Tecnologia" />
        <meta property="og:description" content="Inovação e excelência em tecnologia. Transforme o seu negócio com nossas soluções digitais." />
        <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://leamse.com/" />
        <meta property="twitter:title" content="Leamse | Soluções em Tecnologia" />
        <meta property="twitter:description" content="Inovação e excelência em tecnologia. Transforme o seu negócio com nossas soluções digitais." />
        <meta property="twitter:image" content="%PUBLIC_URL%/og-image.png" />

        <!-- Favicon & PWA Icons -->
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

        <!-- Preconnect & Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

        <!-- Scripts de Terceiros e Analytics -->
        <script>
            window.addEventListener("error", function(e) {
                if (e.error instanceof DOMException && e.error.name === "DataCloneError" && e.message && e.message.includes("PerformanceServerTiming")) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            }, true);
        </script>
    </head>

        <div id="root"></div>
    </body>
</html>
